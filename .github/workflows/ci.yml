name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        # Disposable CI-only database; these values are not secrets and are
        # not used anywhere else.
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: music_metadata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d music_metadata_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/music_metadata_ci
      TEST_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/music_metadata_test
      PGHOST: localhost
      PGUSER: ci_user
      PGPASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -m "not integration" -q

      - name: Apply migrations to a clean database
        run: |
          alembic upgrade head
          alembic check

      - name: Prepare dedicated integration test database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE music_metadata_test"
          psql -d music_metadata_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Integration tests
        run: pytest -m integration -rs -q --junitxml=integration-results.xml

      - name: Fail if integration tests were skipped
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("integration-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"integration tests: {tests}, skipped: {skipped}")
          if tests == 0 or skipped:
              sys.exit("Integration tests were skipped or not collected.")
          EOF

      - name: Matching evaluation
        run: python -m scripts.evaluate_matching

      - name: Build Docker image
        run: docker build --tag music-metadata-intelligence:ci .
